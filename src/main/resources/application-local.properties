# Persistent PostgreSQL used for local development.
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://127.0.0.1:5433/catalog_command_db}
spring.datasource.username=${CATALOG_DB_USERNAME:catalog_app}
spring.datasource.password=${CATALOG_DB_PASSWORD}

# Flyway owns the database schema. Hibernate only verifies entity/schema compatibility.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
