spring.application.name=global-food-catalog-platform

# Local PostgreSQL connection. Values can be overridden with environment variables.
spring.datasource.url=${CATALOG_DB_URL:jdbc:postgresql://127.0.0.1:5433/catalog_command_db}
spring.datasource.username=${CATALOG_DB_USERNAME:catalog_app}
spring.datasource.password=${CATALOG_DB_PASSWORD:catalog_password}

# Flyway creates and upgrades the database schema.
spring.flyway.enabled=true

# Hibernate checks the schema but does not create or modify tables.
spring.jpa.hibernate.ddl-auto=validate

catalog.outbox.max-retries=5
catalog.outbox.batch-size=100
catalog.outbox.poll-delay-ms=1000

spring.kafka.bootstrap-servers=${CATALOG_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

catalog.kafka.menu-item-topic=${CATALOG_KAFKA_MENU_ITEM_TOPIC:catalog.menu-item.v1}
catalog.kafka.send-timeout-ms=${CATALOG_KAFKA_SEND_TIMEOUT_MS:5000}